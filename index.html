<!doctype html>
<html lang="ru" class="upper gridbg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuestLog">
<meta name="theme-color" content="#231e33">
<title>QuestLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontlink" rel="stylesheet" href="">
<style id="themecss"></style>
<style>
:root{--fh:'Press Start 2P',monospace;--fb:'Rubik',system-ui,sans-serif;--hs:1;--fs:17px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
.gridbg body{background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:32px 32px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg.pix,img.spr{display:inline-block;vertical-align:middle;image-rendering:pixelated}
.px{background:var(--panel);margin:4px;padding:16px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--shade)}
h1,h2,h3{font-family:var(--fh);font-weight:400;margin:0;line-height:1.5}
h1{font-size:calc(14px*var(--hs))} h2{font-size:calc(11px*var(--hs))} h3{font-size:calc(9px*var(--hs))}
.upper :is(h1,h2,h3,.lvl,.dh,.btn,nav.tabs button,.fld>label,.fld>.lb,.cnt,table.st th,.mwd,.brand){text-transform:uppercase}
.muted{color:var(--muted)}
small{font-size:.8em}

/* layout */
#app{display:grid;grid-template-columns:290px 1fr;gap:28px;max-width:1240px;margin:0 auto;padding:28px}
.side{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:20px}
main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:40px}
.brand{font-family:var(--fh);font-size:calc(13px*var(--hs));padding:4px 8px;display:flex;align-items:center;gap:10px}

/* hero */
.hero{display:flex;gap:14px;align-items:center}
.hero .avatar{background:var(--panel2);padding:6px;box-shadow:inset 0 0 0 3px var(--line);flex:none}
.hero .avatar>*{width:84px;height:84px;display:block}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hname{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:1.05em}
.hname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font-family:var(--fh);font-size:calc(8px*var(--hs));color:var(--muted)}
.bar{position:relative;height:16px;background:var(--shade);box-shadow:inset 0 0 0 2px var(--line)}
.bar>i{position:absolute;left:2px;top:2px;bottom:2px;display:block;max-width:calc(100% - 4px);background-image:linear-gradient(rgba(255,255,255,.35) 0 3px,transparent 3px);transition:width .4s steps(8)}
.bar.hp>i{background-color:var(--hp)} .bar.xp>i{background-color:var(--xp)}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-family:var(--fh);font-size:calc(7px*var(--hs));font-weight:400;color:#fff;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.goldline{display:flex;align-items:center;gap:6px;font-family:var(--fh);font-size:calc(10px*var(--hs));color:var(--gold)}

/* nav */
nav.tabs{display:flex;flex-direction:column;gap:4px;padding:10px}
nav.tabs button{display:flex;align-items:center;gap:12px;padding:9px 12px;background:none;border:0;cursor:pointer;font-family:var(--fh);font-size:calc(10px*var(--hs));text-align:left}
nav.tabs button.on{background:var(--panel2);box-shadow:inset 0 0 0 3px var(--line)}
nav.tabs button:hover:not(.on){background:var(--chip)}
nav.tabs .more{display:none}

/* buttons */
.btn{font-family:var(--fh);font-size:calc(9px*var(--hs));line-height:1.4;padding:10px 14px;background:var(--accent);color:var(--onaccent);border:0;cursor:pointer;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset -3px -3px 0 0 rgba(0,0,0,.28),inset 3px 3px 0 0 rgba(255,255,255,.28)}
.btn:active{transform:translateY(2px)}
.btn.sec{background:var(--panel2);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ongold)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ib{background:none;border:0;cursor:pointer;padding:4px 6px;font-size:18px;color:var(--muted);flex:none}
.ib:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:calc(16px*var(--hs))}
.ph .sub{font-size:.9em;color:var(--muted);margin-top:6px}

/* sections & rows */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sec-h h2{display:flex;align-items:center;gap:8px}
.cnt{font-family:var(--fh);font-size:calc(9px*var(--hs));color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:var(--panel2);box-shadow:inset 4px 0 0 0 var(--tc,var(--muted))}
.t-daily{--tc:var(--t-daily)} .t-weekly{--tc:var(--t-weekly)} .t-special{--tc:var(--t-special)} .t-task{--tc:var(--t-task)} .t-note{--tc:var(--muted)}
.qrow.done .qt{text-decoration:line-through;color:var(--muted)}
.qrow.done{opacity:.75} .qrow.failed{opacity:.6}
.qi{width:32px;height:32px;flex:none}
.qi img{width:32px;height:32px;display:block}
.qb{flex:1;min-width:0}
.qt{font-weight:600;overflow-wrap:anywhere}
.qm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.78em;padding:1px 7px;background:var(--chip);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip.warn{background:var(--accent);color:var(--onaccent)}
.chip.type{color:#fff;background:var(--tc)}
.rw{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.rc{display:inline-flex;align-items:center;gap:4px;font-family:var(--fh);font-size:calc(8px*var(--hs))}
.rc.xp{color:var(--xp)} .rc.gd{color:var(--gold)}
.chk{width:30px;height:30px;flex:none;border:0;cursor:pointer;background:var(--panel);padding:0;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--line),inset 5px 5px 0 0 var(--shade)}
.chk.on{background:var(--ok);box-shadow:inset 0 0 0 3px var(--line),inset -4px -4px 0 0 rgba(0,0,0,.2)}
.chk:active{transform:scale(.92)}
.empty{color:var(--muted);font-size:.9em;padding:8px 2px}
.quick{display:flex;gap:8px;margin-top:12px}
.inp{width:100%;min-width:0;padding:10px 12px;background:var(--panel);border:0;outline:0;box-shadow:inset 0 0 0 3px var(--line),inset 5px 5px 0 0 var(--shade)}
.quick .inp{flex:1;width:auto}
.inp:focus{box-shadow:inset 0 0 0 3px var(--accent),inset 5px 5px 0 0 var(--shade)}
textarea.inp{resize:vertical;min-height:220px;line-height:1.5}
select.inp{cursor:pointer}

/* filters / tabs */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:0;cursor:pointer;padding:7px 10px;background:var(--panel2);font-size:.9em;box-shadow:inset 0 0 0 2px var(--line)}
.filters button.on{background:var(--ink);color:var(--panel)}

/* plan: week */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-height:180px;cursor:pointer}
.day.today{box-shadow:0 -4px 0 0 var(--accent),0 4px 0 0 var(--accent),-4px 0 0 0 var(--accent),4px 0 0 0 var(--accent),inset 4px 4px 0 0 var(--hi),inset -4px -4px 0 0 var(--shade)}
.day.sel{background:var(--panel2)}
.day.past{opacity:.8}
.dh{font-family:var(--fh);font-size:calc(9px*var(--hs));display:flex;justify-content:space-between}
.mini{font-size:.8em;padding:4px 6px;background:var(--panel2);display:flex;gap:6px;align-items:center;box-shadow:inset 3px 0 0 0 var(--tc,var(--muted));overflow-wrap:break-word;hyphens:auto;min-width:0}
.mini img{width:16px;height:16px;flex:none}
.day.sel .mini{background:var(--panel)}
.mini.done{text-decoration:line-through;color:var(--muted)}
.mini[data-a]{cursor:pointer}
.dbar{height:8px;background:var(--shade);box-shadow:inset 0 0 0 2px var(--line);position:relative}
.dbar i{position:absolute;left:2px;top:2px;bottom:2px;background:var(--t-daily)}
@media (max-width:1100px) and (min-width:861px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* plan: month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mwd{font-family:var(--fh);font-size:calc(8px*var(--hs));color:var(--muted);text-align:center;padding:4px 0}
.mc{min-height:86px;border:0;background:var(--panel2);cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:5px;text-align:left;box-shadow:inset 0 0 0 2px var(--line);min-width:0}
.mc.out{opacity:.35}
.mc.today{box-shadow:inset 0 0 0 3px var(--accent)}
.mc.sel{background:var(--chip);box-shadow:inset 0 0 0 3px var(--ink)}
.mn{font-family:var(--fh);font-size:calc(9px*var(--hs))}
.mdots{display:flex;flex-wrap:wrap;gap:3px}
.mdots i{width:8px;height:8px;display:block}
.mdots .d-task{background:var(--t-task)} .mdots .d-special{background:var(--t-special)} .mdots .d-note{background:var(--muted)}
.mpct{height:6px;background:var(--shade);margin-top:auto}
.mpct i{display:block;height:100%;background:var(--ok)}
.legend{font-size:.8em;margin-top:12px;gap:14px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile .v{font-family:var(--fh);font-size:calc(16px*var(--hs));margin-top:8px}
.tile .k{font-size:.85em;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px;overflow-x:auto;padding:4px 2px}
.heat i{display:block;background:var(--shade)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--shade))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 60%,var(--shade))}
.heat i.l3{background:color-mix(in srgb,var(--ok) 82%,var(--shade))}
.heat i.l4{background:var(--ok)}
.heat i.fut{background:transparent}
.heat i.td{outline:2px solid var(--ink)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ach>div{display:flex;gap:10px;align-items:center;padding:10px;background:var(--panel2)}
.ach>div.lock{opacity:.4;filter:grayscale(1)}
.ach b{display:block;font-size:.9em}
.ach small{color:var(--muted)}
table.st{width:100%;border-collapse:collapse;font-size:.9em}
table.st td,table.st th{padding:6px 4px;text-align:left;border-bottom:2px dashed var(--shade)}
table.st th{font-family:var(--fh);font-size:calc(8px*var(--hs));font-weight:400;color:var(--muted)}
table.st td.n{font-family:var(--fh);font-size:calc(10px*var(--hs));text-align:right}

/* shop */
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcard{padding:14px;background:var(--panel2);display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 3px var(--line)}
.rcard .rh{display:flex;gap:10px;align-items:center}
.rcard .rh img{width:48px;height:48px;flex:none}
.rcard .rt{font-weight:600;overflow-wrap:anywhere}
.rcard .rb{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-items:start}
.note{cursor:pointer;display:flex;flex-direction:column;gap:8px}
.note:hover{background:var(--panel2)}
.note .nh{display:flex;gap:8px;align-items:center;font-weight:600}
.note .nh img{width:24px;height:24px}
.note .nb{white-space:pre-wrap;font-size:.88em;max-height:9.5em;overflow:hidden;overflow-wrap:anywhere}
.note .nd{font-size:.75em;color:var(--muted);display:flex;justify-content:space-between;gap:6px}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tb{border:0;cursor:pointer;padding:7px 10px;background:var(--panel2);font-size:.85em;box-shadow:inset 0 0 0 2px var(--line)}
.tb.on{background:var(--ink);color:var(--panel)}
#cv{width:100%;max-width:520px;aspect-ratio:1;touch-action:none;image-rendering:pixelated;display:block;margin:0 auto;box-shadow:0 0 0 3px var(--line);cursor:crosshair;background:#ddd}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.swc{width:28px;height:28px;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--line)}
.swc.on{outline:3px solid var(--accent);outline-offset:1px}
.curc{width:40px;height:40px;box-shadow:inset 0 0 0 3px var(--line)}
.checker{background-color:#e6e6e6;background-image:linear-gradient(45deg,#c8c8c8 25%,transparent 25%,transparent 75%,#c8c8c8 75%),linear-gradient(45deg,#c8c8c8 25%,transparent 25%,transparent 75%,#c8c8c8 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gal button{aspect-ratio:1;border:0;padding:4px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.gal button.on{box-shadow:inset 0 0 0 3px var(--accent)}
.gal img{width:100%;height:100%}
.gal .add{background:var(--panel2);font-size:24px;color:var(--muted)}
.chk-l{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.9em;padding:3px 0}
.chk-l input{width:18px;height:18px;accent-color:var(--accent)}

/* color picker */
.picker{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;align-items:flex-start}
.pv{display:flex;gap:10px}
#sv{width:220px;height:160px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 3px var(--line);display:block}
#hue{width:24px;height:160px;touch-action:none;cursor:ns-resize;box-shadow:0 0 0 3px var(--line);display:block}
.pfields{display:flex;flex-direction:column;gap:10px}
.pf{display:flex;flex-direction:column;gap:3px;font-size:.75em;color:var(--muted)}
.pf .inp{padding:6px 8px;font-size:1.25em;color:var(--ink)}
#hexin{width:116px;text-transform:lowercase}
.pf input[type=number]{width:74px}

/* mini window */
.minimode #app{display:block;max-width:none;padding:10px 10px 16px}
.minimode .side{display:none}
.minimode main{gap:10px;padding:0}
.mhead{display:flex;gap:10px;align-items:center;padding:10px 12px}
.mhead .avatar{flex:none}
.mhead .avatar>*{width:44px;height:44px;display:block}
.minimode .px{padding:12px}
.minimode .qrow{padding:6px 8px;gap:8px}
.minimode .qrow .ib,.minimode .qi{display:none}
.minimode .qm{margin-top:2px}
.minimode .qm .chip{font-size:.7em}
.minimode .chk{width:26px;height:26px}
.mtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.codeb{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:8px 10px;white-space:pre-wrap;word-break:break-all;font-size:.72em;box-shadow:inset 0 0 0 2px var(--line);max-height:180px;overflow:auto;margin:6px 0}
.f-remind{display:none}
form[data-type="daily"] .f-remind{display:flex}

/* login & sync */
#login:empty{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login>*{width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px}
.lerr{color:var(--hp);min-height:1.3em;font-size:.9em;margin-bottom:8px}
.sdot{width:10px;height:10px;display:inline-block;margin-left:auto;box-shadow:0 0 0 2px var(--line);flex:none}
.sdot.ok{background:var(--ok)} .sdot.busy{background:var(--gold);animation:blink 1s steps(2) infinite} .sdot.err{background:var(--hp)} .sdot.local{display:none}
@keyframes blink{50%{opacity:.3}}

/* settings */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.crow{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:6px 8px;font-size:.88em;cursor:pointer}
input[type=color]{width:38px;height:30px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:0;cursor:pointer;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 2px var(--line);font-size:.85em}
.preset span{display:flex}
.preset i{width:12px;height:16px;display:block}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.tgrid label{display:flex;flex-direction:column;gap:4px;font-size:.78em;color:var(--muted)}
.tgrid .inp{padding:8px 10px;font-size:1.2em;color:var(--ink)}
.rtable input{width:80px;padding:6px 8px}
.stack{display:flex;flex-direction:column;gap:20px}
.fontprev{padding:10px 12px;background:var(--panel2);font-size:.95em}
.fontprev b{font-family:var(--fh);font-weight:400;font-size:calc(11px*var(--hs));display:block;margin-bottom:6px}

/* modal */
#modal:empty{display:none}
.bd{position:fixed;inset:0;background:rgba(10,6,20,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.mod{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto}
.mod h2{margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-family:var(--fh);font-size:calc(8px*var(--hs));color:var(--muted)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;padding:7px 10px;background:var(--panel2);cursor:pointer;font-size:.9em;box-shadow:inset 0 0 0 2px var(--line);min-height:36px}
.seg.ic span{padding:3px}
.seg.ic img{width:30px;height:30px}
.seg input:checked+span{background:var(--ink);color:var(--panel)}
.seg.ic input:checked+span{box-shadow:inset 0 0 0 3px var(--accent)}
.seg input:disabled+span{opacity:.4;cursor:not-allowed}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.f-days,.f-deadline,.f-date{display:none}
form[data-type="daily"] .f-days,form[data-type="special"] .f-deadline,form[data-type="task"] .f-date{display:flex}
.preview{display:flex;gap:12px;align-items:center;font-size:.9em;margin:6px 0 16px;flex-wrap:wrap}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts .r{display:flex;gap:8px}
.center{text-align:center}
.big-av>*{width:128px;height:128px}
.report{display:flex;flex-direction:column;gap:6px;margin:12px 0;max-height:240px;overflow:auto}
.report div{display:flex;justify-content:space-between;gap:10px;font-size:.9em;background:var(--panel2);padding:6px 8px}
.report b{color:var(--hp);font-family:var(--fh);font-size:calc(9px*var(--hs));white-space:nowrap}
.morenav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.morenav button{display:flex;gap:10px;align-items:center;padding:14px;border:0;background:var(--panel2);cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--fh);font-size:calc(9px*var(--hs))}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.float{position:absolute;transform:translate(-50%,0);font-family:var(--fh);font-size:calc(10px*var(--hs));white-space:nowrap;display:flex;gap:10px;padding:6px 8px;background:var(--panel);box-shadow:0 0 0 3px var(--line);animation:up 1.4s steps(14) forwards}
@keyframes up{0%{opacity:0;margin-top:0}10%{opacity:1}70%{opacity:1}100%{opacity:0;margin-top:-60px}}

const N = 32, NN = N*N;
const ALPH = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!#$%&()*+,-/:;<=>?@[]^_{|}~';
function enc(px){
  const p = []; let d = '';
  for (const c of px){ if (!c){ d+='.'; continue; }
    let i = p.indexOf(c); if (i<0){ if (p.length<ALPH.length){ p.push(c); i=p.length-1; } else i=p.length-1; }
    d += ALPH[i]; }
  return {p,d};
}
const dec = sp => [...sp.d].map(ch => ch==='.' ? '' : sp.p[ALPH.indexOf(ch)]);
const sprCache = new Map();
function sprURL(sp){
  const k = sp.id+':'+(sp.v||0); if (sprCache.has(k)) return sprCache.get(k);
  const c = document.createElement('canvas'); c.width = N; c.height = N; const x = c.getContext('2d');
  dec(sp).forEach((col,i)=>{ if (col){ x.fillStyle = col; x.fillRect(i%N,(i/N)|0,1,1); } });
  const u = c.toDataURL(); sprCache.set(k,u); return u;
}

    settings:{theme:'auto',penalty:true},

}
function normalize(s){
  const out = Object.assign(seed(), s);
  const c = s.custom || {}, d = defCustom();
  out.custom = Object.assign(d, c);
  out.custom.colors = {light:Object.assign(clone(PRESETS.parchment.c),(c.colors||{}).light), dark:Object.assign(clone(PRESETS.dungeon.c),(c.colors||{}).dark)};
  out.custom.rules = Object.assign(defRules(), c.rules||{});
  out.custom.labels = c.labels || {}; out.custom.typeIcons = c.typeIcons || {};
  out.settings = Object.assign({theme:'auto',penalty:true}, s.settings||{});
  out.notify = Object.assign(defNotify(), s.notify||{});
  for (const k of ['notes','sprites','purchases','tasks','rewards','quests']) if (!Array.isArray(out[k])) out[k] = [];
  if (out.hero.name==='Герой') out.hero.name = '';
  return out;
}
function readLocal(k){

  return null;
}

const cloudOn = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
let sb = null, user = null, synced = false, dirty = false, pushing = false, pushT = null;
function setSync(st, msg=''){
  ui.sync = {st, msg};
  const d = $('#sdot'); if (d){ d.className = 'sdot '+st; d.title = syncText(); }
  const t = $('#synctext'); if (t) t.textContent = syncText();
}
const syncText = () => ({ok:'Синхронизировано', busy:'Сохраняю в облако…', err:'Нет связи с облаком. Изменения сохранены на устройстве и отправятся позже.', local:'Только на этом устройстве'})[ui.sync.st] + (ui.sync.msg ? ` (${ui.sync.msg})` : '');
async function fetchRemote(){
  const {data, error} = await sb.from('user_state').select('data,updated_at').eq('user_id', user.id).maybeSingle();
  if (error) throw error;
  return data ? {data:data.data, ts:Date.parse(data.updated_at)} : null;
}
function schedulePush(){ clearTimeout(pushT); pushT = setTimeout(push, 1200); }
async function push(){
  if (!user || !synced || pushing) return;
  clearTimeout(pushT); pushing = true; setSync('busy');
  const ts = S._ts || Date.now();
  const {error} = await sb.from('user_state').upsert({user_id:user.id, data:S, updated_at:new Date(ts).toISOString()});
  pushing = false;
  if (error){ setSync('err', error.message); return; }
  if ((S._ts||0) !== ts) schedulePush(); else { dirty = false; setSync('ok'); }
}
async function sync(){
  if (!user || pushing) return;
  try {
    const r = await fetchRemote(); synced = true;
    if (r && r.ts > (S._ts||0)){ S = normalize(r.data); S._ts = r.ts; dirty = false; writeLocal(); sprCache.clear(); ui.ed = null; render(); setSync('ok'); }
    else if (!r || (S._ts||0) > r.ts){ dirty = true; await push(); }
    else setSync('ok');
  } catch(e){ setSync('err'); }
}

async function enterAs(u){
  user = u; LS = 'questlog.v1:'+u.id;
  const cache = readLocal(LS);
  showLoading('Загружаю прогресс…');

  }
  synced = true;
  if (remote && (!cache || remote.ts >= (cache._ts||0))){ S = normalize(remote.data); S._ts = remote.ts; writeLocal(); startApp(); setSync('ok'); }
  else { S = cache || readLocal('questlog.v1') || seed(); if (!S._ts) S._ts = Date.now(); writeLocal(); startApp(); dirty = true; push(); }

const ui = {view:'today', filter:'all', week:0, month:0, planMode:'week', selDay:null, click:null, nq:'',
  setTab:'look', colorSlot:'light', tool:'pen', color:'#1b1209', hsv:null, mirror:false, grid:true, ed:null, sync:{st:'local',msg:''}, keys:null};

/* ===================== ПРАВИЛА ===================== */
const R = () => S.custom.rules;
const DIFF = i => Object.assign({n:L('diff_'+i)}, R().diff[(i||1)-1]);
const TYPES = ['daily','weekly','special','task'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const xpNeed = l => Math.max(10, R().xpBase + R().xpStep*l);
const heroName = () => S.hero.name || L('hero_default');

/* ===================== ЛОГИКА ===================== */
const qDays = q => q.days&&q.days.length ? q.days : [0,1,2,3,4,5,6];
function scheduled(q,k){ return q.type==='daily' && qDays(q).includes(wd(k)) && k>=q.created; }
const dailiesOn = k => S.quests.filter(q=>q.type==='daily' && qDays(q).includes(wd(k)) && (k>=q.created || k>=today()));
function streak(q){
  const t = today();
  if (q.type==='daily'){
    let k = q.hist[t] ? t : addDays(t,-1), n = 0, guard = 0;
    while (guard++<1500 && k>=q.created){ if (scheduled(q,k)){ if (q.hist[k]) n++; else break; } k = addDays(k,-1); }
    return n;
  }
  if (q.type==='weekly'){
    let w = weekOf(t); if (!q.hist[w]) w = addDays(w,-7);
    let n = 0, guard = 0; while (guard++<500 && q.hist[w]){ n++; w = addDays(w,-7); }
    return n;
  }
  return 0;
}
function rewardFor(q, type){
  const d = DIFF(q.diff||1), m = +R().mult[type] || 0;
  const s = (type==='daily'||type==='weekly') ? streak(q) : 0;
  const bonus = 1 + Math.min(s, R().streakMax)*R().streakStep/100;
  return {xp:Math.max(0,Math.round(d.xp*m*bonus)), gold:Math.max(0,Math.round(d.gold*m*bonus)), on:today()};
}
let pendingLevelUp = false;
function gain(r){
  const h = S.hero;
  h.xp += r.xp; h.gold += r.gold;
  S.stats.done++; S.stats.xp += r.xp; S.stats.gold += r.gold;
  S.daylog[r.on] = (S.daylog[r.on]||0)+1;
  while (h.xp >= xpNeed(h.level)){ h.xp -= xpNeed(h.level); h.level++; h.maxHp += R().hpPerLevel; h.hp = h.maxHp; pendingLevelUp = true; }
  fx(`<span class="rc xp">${icon('star',12)}+${r.xp} ${esc(L('cur_xp'))}</span><span class="rc gd">${icon('coin',12)}+${r.gold}</span>`);
}
function undo(r){
  if (!r) return;
  const h = S.hero;
  h.xp -= r.xp;
  while (h.xp < 0 && h.level > 1){ h.level--; h.maxHp = Math.max(50,h.maxHp-R().hpPerLevel); h.xp += xpNeed(h.level); }
  if (h.xp < 0) h.xp = 0;
  h.hp = Math.min(h.hp, h.maxHp); h.gold = Math.max(0, h.gold - r.gold);
  S.stats.done = Math.max(0,S.stats.done-1); S.stats.xp = Math.max(0,S.stats.xp-r.xp); S.stats.gold = Math.max(0,S.stats.gold-r.gold);
  if (S.daylog[r.on]) S.daylog[r.on]--;
}
function toggleQuest(id){
  const q = S.quests.find(x=>x.id===id); if (!q) return;
  const t = today();
  if (q.type==='special'){
    if (q.done){ undo(q.doneReward); q.done=false; q.doneAt=null; q.doneReward=null; }
    else { const r = rewardFor(q,'special'); q.done=true; q.doneAt=t; q.doneReward=r; gain(r); }
  } else {
    const k = q.type==='weekly' ? weekOf(t) : t;
    if (q.hist[k]){ undo(q.hist[k]); delete q.hist[k]; }
    else { const r = rewardFor(q,q.type); q.hist[k]=r; gain(r); q.best = Math.max(q.best||0, streak(q)); }
  }
  commit();
}
function toggleTask(id){
  const x = S.tasks.find(t=>t.id===id); if (!x) return;
  if (x.done){ undo(x.doneReward); x.done=false; x.doneAt=null; x.doneReward=null; }
  else { const r = rewardFor(x,'task'); x.done=true; x.doneAt=today(); x.doneReward=r; gain(r); }
  commit();
}
function commit(){ save(); render(); if (pendingLevelUp){ pendingLevelUp=false; showLevelUp(); } }

function processDays(){
  const t = today();
  if (!S.lastCheck){ S.lastCheck = addDays(t,-1); save(); return; }
  let d = addDays(S.lastCheck,1);
  if (d < addDays(t,-14)) d = addDays(t,-14);
  const report = [];
  while (d < t){
    for (const q of S.quests){
      const dm = DIFF(q.diff||1).dmg;
      if (q.type==='daily' && scheduled(q,d) && !q.hist[d]) report.push({title:q.title, dmg:dm, date:d});
      if (q.type==='weekly' && wd(d)===6 && weekOf(d)>weekOf(q.created) && !q.hist[weekOf(d)]) report.push({title:q.title+' (неделя)', dmg:dm*2, date:d});
      if (q.type==='special' && !q.done && !q.failed && q.deadline && q.deadline<=d){ q.failed=true; report.push({title:q.title+' (провален)', dmg:dm*2, date:d}); }
    }
    d = addDays(d,1);
  }
  S.lastCheck = addDays(t,-1);
  if (report.length && S.settings.penalty){
    const h = S.hero; const total = report.reduce((a,r)=>a+r.dmg,0);
    h.hp -= total; let died = null;
    if (h.hp <= 0){ const lost = Math.floor(h.gold/2); h.gold -= lost; h.hp = h.maxHp; h.deaths++; died = lost; }
    save(); setTimeout(()=>showReport(report,total,died),300);
  } else save();
}

function vToday(){
  const t = today();
  const dailies = S.quests.filter(q=>scheduled(q,t));
  const weeklies = S.quests.filter(q=>q.type==='weekly');
  const specials = S.quests.filter(q=>q.type==='special' && (!q.done || q.doneAt===t)).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
  const tasks = S.tasks.filter(x=>(!x.done && x.date<=t) || (x.done && x.doneAt===t)).sort((a,b)=>(a.done-b.done) || a.date.localeCompare(b.date));
  const dd = dailies.filter(q=>q.hist[t]).length, wdn = weeklies.filter(q=>q.hist[weekOf(t)]).length, td = tasks.filter(x=>x.done).length;
  const label = cap(parse(t).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}));
  const total = dailies.length + tasks.length, doneAll = dd + td;
  const greet = total && doneAll===total ? 'Все квесты дня выполнены. Отдыхай, герой!' : `Выполнено ${doneAll} из ${total} на сегодня`;
  return pageHead('today', `${label} · ${greet}`, `<button class="btn" data-a="new">+ Квест</button>`)
    + section(L('sec_daily'),'sun', dailies.map(q=>qRow(q)).join(''), `${dd}/${dailies.length}`)

function vMonth(t, sel, modeBtns){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+ui.month);
  const first = key(base), dim = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const start = weekOf(first), end = addDays(weekOf(addDays(first,dim-1)),6);
  let cells = WD.map(w=>`<div class="mwd">${w}</div>`).join('');
  for (let k=start; k<=end; k=addDays(k,1)){
    const inM = parse(k).getMonth()===base.getMonth();
    const sched = dailiesOn(k), done = sched.filter(q=>q.hist[k]).length;
    const dots = S.tasks.filter(x=>x.date===k).slice(0,6).map(()=>'<i class="d-task"></i>').join('')
      + S.quests.filter(q=>q.type==='special'&&q.deadline===k).map(()=>'<i class="d-special"></i>').join('')
      + S.notes.filter(n=>n.date===k).slice(0,3).map(()=>'<i class="d-note"></i>').join('');
    const bar = sched.length && k<=t ? `<div class="mpct"><i style="width:${done/sched.length*100}%"></i></div>` : '';
    cells += `<button class="mc ${inM?'':'out'} ${k===t?'today':''} ${k===sel?'sel':''}" data-a="selDay" data-v="${k}"><span class="mn">${parse(k).getDate()}</span><span class="mdots">${dots}</span>${bar}</button>`;
  }
  return pageHead('plan', cap(base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})),
      `<div class="weeknav">${modeBtns}<button class="btn sec" data-a="month" data-v="-1">◀</button>${ui.month!==0?'<button class="btn sec" data-a="month" data-v="0">Сейчас</button>':''}<button class="btn sec" data-a="month" data-v="1">▶</button></div>`)

/* ===================== МАСТЕРСКАЯ (ПИКСЕЛЬ-РЕДАКТОР) ===================== */
const swRow = (lbl, arr, id='') => `<div class="pal" ${id?`id="${id}"`:''}><small class="muted">${lbl}:</small>${arr.map(c=>`<button class="swc ${c===ui.color?'on':''}" data-a="color" data-v="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>`;
function hexToHsv(hex){
  const [r,g,b] = hexRgb(hex).map(v=>v/255), mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn; let h = 0;
  if (d){ if (mx===r) h = ((g-b)/d)%6; else if (mx===g) h = (b-r)/d+2; else h = (r-g)/d+4; h *= 60; if (h<0) h += 360; }
  return {h, s:mx?d/mx:0, v:mx};
}
function hsvToHex({h,s,v}){
  const f = n => { const k = (n+h/60)%6; return v - v*s*Math.max(0,Math.min(k,4-k,1)); };
  return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}
function addRecent(c){ if (!c) return; S.custom.recent = [c, ...(S.custom.recent||[]).filter(x=>x!==c)].slice(0,18); const el = $('#recent'); if (el) el.outerHTML = swRow('Недавние', S.custom.recent, 'recent'); }
let picker = null;
function initPicker(){
  const sv = $('#sv'), hu = $('#hue'); if (!sv) return;
  if (!ui.hsv || hsvToHex(ui.hsv)!==ui.color) ui.hsv = hexToHsv(ui.color);
  const sx = sv.getContext('2d'), hx = hu.getContext('2d');
  const drawSV = () => { const w = sv.width, h = sv.height;
    sx.fillStyle = `hsl(${ui.hsv.h},100%,50%)`; sx.fillRect(0,0,w,h);
    let g = sx.createLinearGradient(0,0,w,0); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)'); sx.fillStyle = g; sx.fillRect(0,0,w,h);
    g = sx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000'); sx.fillStyle = g; sx.fillRect(0,0,w,h);
    const x = ui.hsv.s*w, y = (1-ui.hsv.v)*h;
    sx.lineWidth = 3; sx.strokeStyle = '#000'; sx.strokeRect(x-6,y-6,12,12); sx.lineWidth = 1; sx.strokeStyle = '#fff'; sx.strokeRect(x-6,y-6,12,12); };
  const drawHue = () => { const w = hu.width, h = hu.height; const g = hx.createLinearGradient(0,0,0,h);
    for (let i=0;i<=6;i++) g.addColorStop(i/6,`hsl(${i*60},100%,50%)`); hx.fillStyle = g; hx.fillRect(0,0,w,h);
    const y = ui.hsv.h/360*h; hx.fillStyle = '#000'; hx.fillRect(0,y-3,w,6); hx.fillStyle = '#fff'; hx.fillRect(2,y-1,w-4,2); };
  const apply = () => { setPickColor(hsvToHex(ui.hsv), true); drawSV(); drawHue(); };
  const rel = (el,e) => { const r = el.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; };
  const drag = (el,fn) => { let d = false;
    el.onpointerdown = e => { e.preventDefault(); d = true; el.setPointerCapture(e.pointerId); fn(e); };
    el.onpointermove = e => { if (d) fn(e); };
    el.onpointerup = el.onpointercancel = () => { d = false; }; };
  drag(sv, e => { const [x,y] = rel(sv,e); ui.hsv.s = x; ui.hsv.v = 1-y; apply(); });
  drag(hu, e => { const [,y] = rel(hu,e); ui.hsv.h = Math.min(359.9, y*360); apply(); });
  picker = {drawSV, drawHue};
  drawSV(); drawHue();
}
function setPickColor(hex, keepHsv){
  ui.color = hex; if (!keepHsv){ ui.hsv = hexToHsv(hex); if (picker){ picker.drawSV(); picker.drawHue(); } }
  if (ui.tool==='eraser' || ui.tool==='picker'){ ui.tool = 'pen'; document.querySelectorAll('.tb[data-a=tool]').forEach(b=>b.classList.toggle('on', b.dataset.v==='pen')); }
  const c = $('#curc'); if (c) c.style.background = hex;
  const h = $('#hexin'); if (h && document.activeElement!==h) h.value = hex;
  hexRgb(hex).forEach((v,i)=>{ const el = $('#rgb'+i); if (el && document.activeElement!==el) el.value = v; });
}

function initCanvas(){
  const cv = $('#cv'); if (!cv) return;
  const ctx = cv.getContext('2d'); const cs = cv.width/N;
  const draw = () => {
    for (let i=0;i<NN;i++){ const x=i%N, y=(i/N)|0;
      ctx.fillStyle = ui.ed.px[i] || (((x>>1)+(y>>1))%2 ? '#d4d4d4' : '#ececec');
      ctx.fillRect(x*cs,y*cs,cs,cs); }
    if (ui.grid){
      ctx.fillStyle = 'rgba(0,0,0,.10)';
      for (let i=1;i<N;i++){ ctx.fillRect(i*cs,0,1,cv.height); ctx.fillRect(0,i*cs,cv.width,1); }
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(16*cs,0,1,cv.height); ctx.fillRect(0,16*cs,cv.width,1);
    }
  };
  const cell = e => { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX-r.left)/r.width*N), Math.floor((e.clientY-r.top)/r.height*N)]; };
  const put = (x,y) => {
    if (x<0||y<0||x>=N||y>=N) return;
    const c = ui.tool==='eraser' ? '' : ui.color;
    ui.ed.px[y*N+x] = c; if (ui.mirror) ui.ed.px[y*N+(N-1-x)] = c;
  };
  let last = null, down = false;
  cv.onpointerdown = e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x,y] = cell(e); if (x<0||y<0||x>=N||y>=N) return;
    if (ui.tool==='picker'){ const c = ui.ed.px[y*N+x]; if (c){ ui.color = c; ui.hsv = hexToHsv(c); ui.tool = 'pen'; refreshStudio(); } return; }
    pushUndo();
    if (ui.tool==='fill'){ flood(ui.ed.px, y*N+x, ui.color); if (ui.mirror) flood(ui.ed.px, y*N+(N-1-x), ui.color); draw(); addRecent(ui.color); commitSprite(); return; }
    down = true; last = [x,y]; put(x,y); draw();
  };
  cv.onpointermove = e => {
    if (!down) return; const [x,y] = cell(e);
    lineCells(last[0],last[1],x,y,put); last = [x,y]; draw();
  };
  cv.onpointerup = cv.onpointercancel = () => { if (down){ down = false; if (ui.tool==='pen') addRecent(ui.color); commitSprite(); } };
  draw();
}
function pushUndo(){ ui.ed.undo.push(ui.ed.px.slice()); if (ui.ed.undo.length>60) ui.ed.undo.shift(); }
function flood(px,i,col){
  const from = px[i]; if (from===col) return; const st = [i];
  while (st.length){ const j = st.pop(); if (px[j]!==from) continue; px[j] = col;
    const x = j%N, y = (j/N)|0; if (x>0) st.push(j-1); if (x<N-1) st.push(j+1); if (y>0) st.push(j-N); if (y<N-1) st.push(j+N); }
}
function lineCells(x0,y0,x1,y1,fn){
  const dx = Math.abs(x1-x0), sx = x0<x1?1:-1, dy = -Math.abs(y1-y0), sy = y0<y1?1:-1; let err = dx+dy, g = 0;
  while (g++<200){ fn(x0,y0); if (x0===x1&&y0===y1) break; const e2 = 2*err; if (e2>=dy){ err+=dy; x0+=sx; } if (e2<=dx){ err+=dx; y0+=sy; } }
}
function commitSprite(){

  Object.assign(sp, enc(ui.ed.px)); sp.v = (sp.v||0)+1; save();
  const side = $('#studio-side'); if (side) side.innerHTML = studioSide();

}

/* ===================== ПУШ-УВЕДОМЛЕНИЯ (клиент) ===================== */
const b64u = buf => { const b = new Uint8Array(buf); let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s += '='; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); };
let swReg = null;
async function initSW(){
  if (!('serviceWorker' in navigator) || location.protocol!=='https:') return;
  try { swReg = await navigator.serviceWorker.register('sw.js'); } catch(e){}
}
async function deviceSub(){
  if (!('serviceWorker' in navigator)) return null;
  swReg = swReg || await navigator.serviceWorker.getRegistration();
  return swReg ? swReg.pushManager.getSubscription() : null;
}
async function refreshPushState(){
  const el = $('#pushstate'), bt = $('#pushbtns'); if (!el) return;
  if (location.protocol!=='https:'){ el.textContent = 'Уведомления работают только на сайте (https), а не из локального файла.'; return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){ el.textContent = 'Этот браузер не поддерживает пуш-уведомления.'; return; }
  const sub = await deviceSub();
  el.textContent = sub ? 'Подключено: напоминания будут приходить на это устройство.'
    : Notification.permission==='denied' ? 'Уведомления заблокированы для этого сайта в настройках браузера. Разреши их и обнови страницу.' : 'Это устройство не подключено.';
  bt.innerHTML = sub ? '<button class="btn sec" data-a="pushTest">Тестовое уведомление</button><button class="btn sec" data-a="pushOff">Отключить</button>'
    : '<button class="btn" data-a="pushOn">Подключить это устройство</button>';
}
async function pushOn(){
  try {
    const perm = await Notification.requestPermission();
    if (perm!=='granted') return alert('Нужно разрешить уведомления для этого сайта.');
    swReg = swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await swReg.pushManager.getSubscription();
    if (!sub) sub = await swReg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:unb64u(CONFIG.VAPID_PUBLIC_KEY)});
    const j = sub.toJSON();
    const {error} = await sb.from('push_subs').upsert({endpoint:j.endpoint, user_id:user.id, sub:j, device:navigator.userAgent.slice(0,150)});
    if (error) return alert('Не удалось сохранить подписку: '+error.message);
    if (!S.notify.enabled){ S.notify.enabled = true; save(); }
    if (ui.view==='settings') render();
  } catch(e){ alert('Не получилось подключить уведомления: '+e.message); }
}
async function pushOff(){
  const sub = await deviceSub();
  if (sub){ await sb.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  refreshPushState();
}
async function pushTest(){
  const {data} = await sb.auth.getSession();
  try {
    const r = await fetch(CONFIG.SUPABASE_URL+'/functions/v1/remind', {method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+data.session.access_token, apikey:CONFIG.SUPABASE_KEY}, body:JSON.stringify({test:true})});
    const j = await r.json().catch(()=>({}));
    alert(r.ok ? (j.sent ? `Отправлено на устройств: ${j.sent}. Уведомление придёт через пару секунд.` : 'Не найдено подключённых устройств.') : 'Ошибка функции remind: '+(j.error||j.msg||r.status));
  } catch(e){ alert('Функция remind недоступна. Проверь, что она создана в Supabase. ('+e.message+')'); }
}
async function genKeys(){
  const kp = await crypto.subtle.generateKey({name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']);
  const pub = b64u(await crypto.subtle.exportKey('raw', kp.publicKey));
  const j = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const cron = b64u(crypto.getRandomValues(new Uint8Array(24)));
  const url = CONFIG.SUPABASE_URL || 'https://ТВОЙ-ПРОЕКТ.supabase.co';
  ui.keys = {
    cfg: `VAPID_PUBLIC_KEY: '${pub}',`,
    vapid: JSON.stringify({publicKey:pub, privateJwk:{kty:j.kty, crv:j.crv, x:j.x, y:j.y, d:j.d}}),
    cron,
    sql: `create extension if not exists pg_cron with schema pg_catalog;
create extension if not exists pg_net with schema extensions;

select cron.unschedule('questlog-remind') where exists (select 1 from cron.job where jobname = 'questlog-remind');

select cron.schedule('questlog-remind', '*/5 * * * *', $job$
  select net.http_post(
    url := '${url}/functions/v1/remind',
    headers := '{"Content-Type":"application/json","x-cron-secret":"${cron}"}'::jsonb,
    body := '{}'::jsonb
  );
$job$);`,
  };
  render();
}

function vMini(){
  const t = today(), h = S.hero, need = xpNeed(h.level);
  const dailies = S.quests.filter(q=>scheduled(q,t));
  const tasks = S.tasks.filter(x=>(!x.done && x.date<=t) || (x.done && x.doneAt===t)).sort((a,b)=>(a.done-b.done) || (a.time||'99').localeCompare(b.time||'99'));
  const weeklies = S.quests.filter(q=>q.type==='weekly' && !q.hist[weekOf(t)]);
  const specials = S.quests.filter(q=>q.type==='special' && !q.done && !q.failed && q.deadline && daysBetween(t,q.deadline)<=2);
  const all = dailies.length + tasks.length, done = dailies.filter(q=>q.hist[t]).length + tasks.filter(x=>x.done).length;
  const rows = dailies.map(q=>qRow(q)).join('') + tasks.map(x=>tRow(x)).join('') + specials.map(q=>qRow(q)).join('') + weeklies.map(q=>qRow(q)).join('');

      <div class="goldline">${icon('coin',14)} ${h.gold}</div></div>
    <section class="px"><div class="mtitle"><h2>${esc(L('title_today'))}</h2><span class="cnt">${done}/${all}</span></div>
      <div class="list">${rows || '<div class="empty">На сегодня квестов нет</div>'}</div>
      <form class="quick" data-f="quick"><input class="inp" name="title" placeholder="Новое поручение…" autocomplete="off"><button class="btn sec" type="submit">+</button></form></section>
    <div class="row" style="justify-content:center"><button class="btn sec" data-a="openMain">Открыть приложение</button></div>`;

function questForm(item, kind, presetDate){

        <input class="inp" type="date" name="date" value="${item&&item.date||presetDate||today()}"><input class="inp" type="time" name="time" value="${item&&item.time||''}" style="max-width:150px"></div></div>
      <div class="fld f-remind"><label>Напомнить в (необязательно)</label><input class="inp" type="time" name="remind" value="${item&&item.remind||''}" style="max-width:150px"></div>

function updatePreview(){
  const f = $('#modal form[data-f=quest]'); if (!f) return;
  const fd = new FormData(f); const type = fd.get('type') || f.dataset.type; const diff = +fd.get('diff')||1;
  f.dataset.type = type;
  const r = rewardFor({diff, type, hist:{}, created:today()}, type);
  $('#pv').innerHTML = `<span class="muted">Награда:</span> ${rewardHtml(r)} ${type==='daily'?`<span class="muted">· пропуск: −${DIFF(diff).dmg} ${esc(L('cur_hp'))}</span>`:''}`;
}
function saveQuestForm(f){
  const fd = new FormData(f);
  const type = fd.get('type') || f.dataset.type; const title = String(fd.get('title')||'').trim(); if (!title) return;
  const diff = +fd.get('diff')||1, id = f.dataset.id, t = today(), ic = fd.get('icon') || null;
  if (type==='task'){
    let x = id && S.tasks.find(a=>a.id===id);
    if (!x){ x = {id:uid(), done:false, created:t}; S.tasks.push(x); }
    Object.assign(x, {title, diff, icon:ic, date:fd.get('date') || t, time:fd.get('time') || null});
  } else {
    let q = id && S.quests.find(a=>a.id===id);
    if (!q){ q = {id:uid(), type, hist:{}, best:0, created:t, done:false}; S.quests.push(q); }
    Object.assign(q, {title, diff, icon:ic});
    if (type==='daily'){ q.days = fd.getAll('days').map(Number); if (!q.days.length) q.days = [0,1,2,3,4,5,6]; q.remind = fd.get('remind') || null; }
    if (type==='special'){ q.deadline = fd.get('deadline') || null; if (q.failed && (!q.deadline || q.deadline>=t)) q.failed = false; }
  }
  save(); closeModal(); render();
}

function fx(html){
  const d = document.createElement('div'); d.className = 'float'; d.innerHTML = html;
  const c = ui.click || {x:innerWidth/2, y:innerHeight/2};
  d.style.left = Math.min(Math.max(c.x,90), innerWidth-90)+'px'; d.style.top = (c.y-40)+'px';

  export:()=>{

document.addEventListener('click', e => {
  ui.click = {x:e.clientX, y:e.clientY};
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) fn(el,e);
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.f==='login'){ doLogin(f); return; }
  const fd = new FormData(f); const t = today();
  if (f.dataset.f==='quick'){
    const v = String(fd.get('title')||'').trim(); if (!v) return;
    S.tasks.push({id:uid(), title:v, diff:1, date:t, done:false, created:t}); save(); render();
    const i = $('form[data-f=quick] input'); if (i) i.focus();
  }
  if (f.dataset.f==='quest') saveQuestForm(f);
  if (f.dataset.f==='reward'){
    const title = String(fd.get('title')||'').trim(); const cost = Math.max(1, +fd.get('cost')||1); if (!title) return;
    let r = f.dataset.id && S.rewards.find(x=>x.id===f.dataset.id);
    if (!r){ r = {id:uid()}; S.rewards.push(r); } Object.assign(r, {title, cost, icon:fd.get('icon')||null});
    save(); closeModal(); render();
  }
  if (f.dataset.f==='note'){
    const title = String(fd.get('title')||'').trim(), body = String(fd.get('body')||'');
    if (!title && !body.trim()){ closeModal(); return; }
    let n = f.dataset.id && S.notes.find(x=>x.id===f.dataset.id);
    if (!n){ n = {id:uid(), created:new Date().toISOString()}; S.notes.push(n); }
    Object.assign(n, {title, body, date:fd.get('date')||null, pinned:!!fd.get('pinned'), icon:fd.get('icon')||null, updated:new Date().toISOString()});
    save(); closeModal(); render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.set){
    const v = el.type==='checkbox' ? el.checked : (el.type==='number'||el.type==='range') ? Number(el.value) : el.value;
    setPath(el.dataset.set, v); saveSoon(); applyStyle(); renderChrome();
    if (el.dataset.out) $('#'+el.dataset.out).textContent = v;

  if (el.id==='nsearch'){ ui.nq = el.value; $('#notelist').innerHTML = notesList(); }
  if (el.id==='sprname'){ const sp = getSpr(ui.ed.id); if (sp){ sp.name = el.value; saveSoon(); } }

  if (/^rgb[012]$/.test(el.id)){ const c = [0,1,2].map(i=>Math.max(0,Math.min(255,+$('#rgb'+i).value||0))); setPickColor('#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')); }
});
document.addEventListener('change', e => {
  if (e.target.closest && e.target.closest('form[data-f=quest]')) updatePreview();
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
  if (ui.view==='studio' && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); A.edUndo(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyStyle);

function tick(){ if (S && $('#main').innerHTML && today()!==renderedDay){ processDays(); render(); } }
document.addEventListener('visibilitychange', () => {
  if (!S || !$('#main').innerHTML) return;
  if (document.hidden){ if (dirty) push(); }
  else { tick(); sync(); }
});
addEventListener('online', () => sync());
addEventListener('storage', e => {
  if (!S || e.key!==LS || !e.newValue) return;
  try { const s = JSON.parse(e.newValue); if ((s._ts||0) > (S._ts||0)){ S = normalize(s); sprCache.clear(); render(); } } catch(err){}
});
setInterval(() => { if (!document.hidden && user) sync(); }, 180000);
setInterval(tick, 60000);

/* ===================== СТАРТ ===================== */
boot();
</script>
</body>
